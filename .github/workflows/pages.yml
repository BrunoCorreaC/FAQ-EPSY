# Publica o app (pasta HTML/carro-facil) no GitHub Pages a cada push na main.
# Para ativar uma vez: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Publicar app (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'HTML/carro-facil/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copiar só o que o navegador precisa (sem SQL nem README)
        run: |
          mkdir _site
          rsync -a --exclude 'supabase' --exclude 'README.md' HTML/carro-facil/ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
